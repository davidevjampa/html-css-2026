<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserindo videos hospedados localmente</h1>
    <p>Este video esta hospedado no meu proprio servidor</p>
    <video poster="imagens/tumbnail-campo.png" width="300"controls autoplays loop>
       <source src="midia/Meu-Video.ogv.ogv" type="video/ogv">
       <source src="midia/Meu-Video.webm.webm" type="video/webm">
       <source src="midia/Meu-Video.M4V.m4v" type="video/m4v">
       <source src="midia/meu-video.mp4.mp4" type="video/mp4">
    </video>
    <p>Seu navegador não tem compatibilidade com reprodução de videos</p>

    <h1>Inserindo videos do Youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/3TLcFzWoUmQ?si=8dm5CvDA1vTZz1ej" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <h1>Inserindo videos do Vimeo</h1>
    <div style="padding:56.25% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/71127606?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" style="position:absolute;top:0;left:0;width:50%;height:100%;" title="Animation Reel 2022"></iframe></div><script src="https://player.vimeo.com/api/player.js"></script>
</body>
</html>
