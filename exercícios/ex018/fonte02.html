<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
       @font-face {
        font-family:Love ;
        src: url('love story ttf') format('truetype');
       }
            /* 
            Tipos de format ()
            -opentype (otf) 
            -truetype (ttf)
            -embedded-opentype
            -truetype-aat (Apple Advanced TYpography)
            -svg
            */
        
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Officiis aut eaque, nam aperiam recusandae accusantium, animi beatae, ullam provident nisi labore. Amet error laborum a porro deleniti nostrum aliquam illum.</p>
</body>
</html>
